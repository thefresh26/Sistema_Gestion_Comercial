{% extends "documentos/base.html" %}
{% block titulo %}Buscar caso{% endblock %}
{% block contenido %}
<div class="container">
  <div class="hero">
    <h1>Elige qué necesitas<br>y genera el documento al instante.</h1>
    <p>Escoge el tipo de documento, escribe el FMI o el nombre, y el sistema reúne la información y lo genera por ti.</p>
  </div>

  <div class="field" style="margin-bottom:18px">
    <label>Tipo de documento</label>
    <select id="tipo-select" style="width:100%; padding:12px 14px; font-size:15px">
      {% for clave, info in tipos.items() %}
      <option value="{{ clave }}" {% if not info.disponible %}disabled{% endif %}>
        {{ info.etiqueta }}{% if not info.disponible %} — próximamente{% endif %}
      </option>
      {% endfor %}
    </select>
  </div>

  <div class="search-box">
    <input type="text" id="buscador" placeholder="Ej. 001-389120, 001-389121, 024-20085 (o un nombre)" autofocus>
    <button class="btn" onclick="buscar()">Buscar</button>
  </div>

  <div class="results" id="resultados"></div>
</div>

<script>
function dividirTerminos(texto) {
  return texto
    .split(/[,;\n\/]+/)
    .map(t => t.trim())
    .filter(t => t.length > 0);
}

async function buscarUnTermino(termino, tipo) {
  const res = await fetch(`/api/documentos/buscar?q=${encodeURIComponent(termino)}&tipo=${encodeURIComponent(tipo)}`);
  return res.json();
}

function filaResultado(c, tipo) {
  const badge = c.estado || 'pendiente';
  return `<a class="result-row" href="/documentos/caso/${tipo}/${encodeURIComponent(c.fmi)}">
    <div><div class="fmi">${c.fmi}</div><div class="nombre">${c.arrendatario_nombre || 'Sin arrendatario'} · ${c.direccion || ''}</div></div>
    <span class="badge ${badge}">${badge.replace('_', ' ')}</span>
  </a>`;
}

function filaCasoNuevo(termino, tipo) {
  return `<a class="result-row" href="/documentos/caso/${tipo}/${encodeURIComponent(termino)}">
    <div><div class="fmi">${termino}</div><div class="nombre">Caso nuevo — clic para crearlo</div></div>
  </a>`;
}

async function buscar() {
  const textoOriginal = document.getElementById('buscador').value.trim();
  const tipo = document.getElementById('tipo-select').value;
  const cont = document.getElementById('resultados');
  cont.innerHTML = '';
  if (!textoOriginal) return;

  const terminos = dividirTerminos(textoOriginal);

  // Búsqueda de un solo término (nombre parcial o FMI): igual que antes,
  // puede traer varios casos que coincidan.
  if (terminos.length <= 1) {
    const casos = await buscarUnTermino(textoOriginal, tipo);
    if (casos.length === 0) {
      cont.innerHTML = filaCasoNuevo(textoOriginal, tipo);
    } else {
      cont.innerHTML = casos.map(c => filaResultado(c, tipo)).join('');
    }
    return;
  }

  // Búsqueda masiva: varios FMI separados por coma, punto y coma, "/" o
  // salto de línea -- uno por uno, y si alguno no existe se deja la fila
  // de "caso nuevo" para poder crearlo igual con un clic.
  cont.innerHTML = `<p class="ayuda-masiva">Buscando ${terminos.length} casos…</p>`;
  const filasHtml = [];
  for (const termino of terminos) {
    const casos = await buscarUnTermino(termino, tipo);
    const exacto = casos.find(c => c.fmi.toUpperCase() === termino.toUpperCase());
    if (exacto) {
      filasHtml.push(filaResultado(exacto, tipo));
    } else if (casos.length > 0) {
      filasHtml.push(casos.map(c => filaResultado(c, tipo)).join(''));
    } else {
      filasHtml.push(filaCasoNuevo(termino, tipo));
    }
  }
  cont.innerHTML = filasHtml.join('');
}

document.getElementById('buscador').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); buscar(); }
});
</script>
{% endblock %}
