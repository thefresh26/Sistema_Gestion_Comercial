<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<script>(function(){try{var t=localStorage.getItem('apc-theme');document.documentElement.setAttribute('data-theme', t==='dark'?'dark':'light');}catch(e){document.documentElement.setAttribute('data-theme','light');}})();</script>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Permisos</title>
<link rel="icon" type="image/png" href="/portal/public/logos/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/css/styles.css">
</head>
<body>

<header>
  <div class="header-inner">
    <div>
      <div class="brand-eyebrow">Administración</div>
      <h1 class="brand-title">Permisos de usuarios</h1>
      <p class="brand-sub">Crea usuarios y decide qué módulos puede ver cada uno, según su rol</p>
    </div>
    <div class="header-botones">
      <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar entre modo claro y oscuro" title="Cambiar tema">
        <svg class="icon-sol" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
        <svg class="icon-luna" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="btn-secundario-header" id="btn-sincronizar-nombres" title="Copia el nombre desde Microsoft 365 para los usuarios que aún no tengan uno guardado">Copiar nombres de Microsoft 365</button>
      <button class="btn-nuevo" id="btn-nuevo-usuario">+ Nuevo usuario</button>
    </div>
  </div>
</header>

<main>
  <div id="estado-carga">Cargando usuarios…</div>
  <div id="estado-error" style="display:none;"></div>

  <div id="contenido" style="display:none;">

    <section class="chart-card" id="tarjeta-referencia">
      <div class="chart-head">
        <h2>Qué ve cada rol</h2>
      </div>
      <div class="ref-grid" id="ref-grid"></div>
    </section>

    <section class="chart-card">
      <div class="chart-head">
        <h2>Usuarios</h2>
        <span class="conteo" id="conteo-usuarios"></span>
      </div>
      <div class="tabla-wrap">
        <table id="tabla-usuarios">
          <thead>
            <tr>
              <th>Usuario</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Último ingreso</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tabla-usuarios-body"></tbody>
        </table>
      </div>
    </section>

  </div>
</main>

<!-- ═══════════ MODAL: nuevo usuario / editar contraseña ═══════════ -->
<div class="modal-fondo" id="modal-fondo">
  <div class="modal-card" id="modal-nuevo">
    <h3>Nuevo usuario</h3>
    <label for="nu-nombre">Nombre completo</label>
    <input id="nu-nombre" type="text" placeholder="p. ej. María Pérez" autocomplete="off">
    <label for="nu-usuario">Usuario o correo</label>
    <input id="nu-usuario" type="text" placeholder="p. ej. juridica2026 o nombre@correo.com" autocomplete="off">
    <label for="nu-password">Contraseña</label>
    <input id="nu-password" type="text" placeholder="Mínimo 8 caracteres" autocomplete="off">
    <label for="nu-rol">Rol</label>
    <select id="nu-rol"></select>
    <p class="modal-nota" id="nu-nota"></p>
    <div class="modal-error" id="nu-error"></div>
    <div class="modal-botones">
      <button class="btn-secundario" id="nu-cancelar">Cancelar</button>
      <button class="btn-primario" id="nu-crear">Crear usuario</button>
    </div>
  </div>
</div>

<div class="modal-fondo" id="modal-fondo-clave">
  <div class="modal-card" id="modal-clave">
    <h3>Editar usuario</h3>
    <p class="modal-nota" id="clave-usuario-nombre"></p>
    <label for="cl-nombre">Nombre completo</label>
    <input id="cl-nombre" type="text" placeholder="p. ej. María Pérez" autocomplete="off">
    <label for="cl-password">Nueva contraseña (opcional)</label>
    <input id="cl-password" type="text" placeholder="Déjalo en blanco para no cambiarla" autocomplete="off">
    <div class="modal-error" id="cl-error"></div>
    <div class="modal-botones">
      <button class="btn-secundario" id="cl-cancelar">Cancelar</button>
      <button class="btn-primario" id="cl-guardar">Guardar</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script src="src/js/app.js"></script>
<script>
document.getElementById('theme-toggle').addEventListener('click', function(){
  var root = document.documentElement;
  var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try{ localStorage.setItem('apc-theme', next); }catch(e){}
});
</script>
</body>
</html>
