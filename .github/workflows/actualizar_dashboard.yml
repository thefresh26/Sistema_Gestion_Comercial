name: Actualizar Dashboard de Ventas

# El "schedule" automático de este workflow quedó DESACTIVADO: la base de
# datos "intranet" en Azure solo acepta conexiones desde IPs autorizadas, y
# los servidores de GitHub Actions no están en esa lista (además cambian de
# IP cada vez que corren) — por más correcta que esté la contraseña, siempre
# da error de autenticación. La actualización automática real ahora corre
# como una Tarea Programada de Windows en un computador de la empresa que sí
# tiene su IP autorizada (ver scripts/tarea_programada_local.ps1.ejemplo).
#
# Este workflow se deja aquí solo para poder lanzarlo A MANO desde la
# pestaña "Actions" (botón "Run workflow") — por ejemplo, el día que se abra
# el firewall de Azure para GitHub Actions, o para probar manualmente.

on:
  workflow_dispatch: {}     # permite lanzarlo a mano desde GitHub
  # schedule:
  #   - cron: "0 11 * * *"   # DESACTIVADO — ver nota arriba (bloqueado por firewall de Azure)

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Calcular y guardar los totales del dashboard
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          INTRANET_DB_HOST: ${{ secrets.INTRANET_DB_HOST }}
          INTRANET_DB_PORT: ${{ secrets.INTRANET_DB_PORT }}
          INTRANET_DB_NAME: ${{ secrets.INTRANET_DB_NAME }}
          INTRANET_DB_USER: ${{ secrets.INTRANET_DB_USER }}
          INTRANET_DB_PASSWORD: ${{ secrets.INTRANET_DB_PASSWORD }}
        run: python scripts/actualizar_dashboard.py
