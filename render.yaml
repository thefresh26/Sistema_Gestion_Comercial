services:
  - type: web
    name: sistema-gestion-comercial
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false

# La tarea programada que actualiza el dashboard "Estadísticas" NO corre
# aquí en Render (eso pedía tarjeta de crédito para los Cron Jobs) — corre
# gratis como GitHub Action, ver .github/workflows/actualizar_dashboard.yml.
